name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout CyTime
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org/

      - name: Build Tauri application
        run: bun run tauri:build
        env:
          CI: true

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: cytime-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: cytime-windows-x64
          path: assets

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -e 'process.stdout.write(require("./src-tauri/tauri.conf.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          previous=$(git tag --sort=-version:refname | grep -v "^$tag$" | head -1 || true)
          if [ -z "$previous" ]; then previous=$(git rev-list --max-parents=0 HEAD); fi
          {
            echo "## CyTime ${{ steps.version.outputs.version }}"
            echo
            git log --pretty='- %s' --no-merges "$previous..HEAD"
          } > release-notes.md

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" assets/* --clobber
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" assets/* --title "CyTime 昔时时钟 $tag" --notes-file release-notes.md
          fi
